Database Specs

PostgreSQL V 18.4

Database models:

Academy (it serves as the conventional user in any other application)
  - id unique | not null | autoincrement
  - name: string | unique | not null
  - email: string | unique | not null
  - password: string | not null

Headquarters (belongs to an Academy, many to one relationship)
  - id unique | not null | autoincrement
  - academy_id: foreign key to Academy(id) | not null
  - name: string | not null

Classroom (belongs to a Headquarters, many to one relationship)
  - id unique | not null | autoincrement
  - headquarters_id: foreign key to Headquarters(id) | not null
  - name: string | not null
  - classes_capacity: integer | not null

Class (belongs to a Classroom, many to one relationship | many students thourgh ClassInscription (many to many) | many to one relationship with Instructor | many to one relationship with Schedule)
  - id unique | not null | autoincrement
  - classroom_id: foreign key to Classroom(id) | not null
  - name: string | not null
  - instructor_id: foreign key to Instructor(id) | not null
  - start_date: date | not null
  - schedule_id: foreign key to Schedule(id) | not null
  - quota: integer | not null
  - instructor_name: string | not null

Student (belongs to Academy, many to one relationship)
  - id unique | not null | autoincrement
  - academy_id: foreign key to Academy(id) | not null
  - name: string | not null
  - email: string | unique | not null
  - identification_number: string | unique | not null
  - phone_number: string | not null
  - address: string | not null
  - date_of_birth: date | not null
  - alergies: text | default : 'N/A'
  - referral_source: string | not null
  - occupation: string | not null

ClassInscription (belongs to Class and Student, represents a many-to-many relationship between Class and Student)
  - id unique | not null | autoincrement
  - class_id: foreign key to Class(id) | not null
  - student_id: foreign key to Student(id) | not null
  - inscription_date: timestamp | not null
  - graduation_date: timestamp | nullable
  - role: enum('leader', 'follower') | not null

Schedule (Has many Classes | belongs to Headquarters many to one relationship)
  - id unique | not null | autoincrement
  - headquarters_id: foreign key to Headquarters(id) | not null
  - name: string | not null
  - start_time: time | not null
  - end_time: time | not null