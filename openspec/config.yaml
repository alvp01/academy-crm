schema: spec-driven

context: |
  Tech stack: Python 3.11, FastAPI, SQLAlchemy 2.0 (async), PostgreSQL 16, Alembic (backend);
              React 19, TypeScript 5.7, Vite 6, Tailwind CSS 3.4, Zustand 5, TanStack Query 5 (frontend)
  Architecture: Layered (API → Services → Repositories), multi-tenant via academy_id
  Testing: pytest + pytest-asyncio + httpx (backend); no frontend test runner
  Style: Strict TypeScript (noUncheckedIndexedAccess), Python 3.11+, Docker Compose local dev
  Persistence: OpenSpec file-based

strict_tdd: true

testing:
  runner: pytest
  command: "cd backend && pytest -v"
  coverage_command: ""
  linter: ""
  type_checker: "cd frontend && tsc --noEmit"
  formatter: ""

rules:
  proposal:
    - Include rollback plan for risky changes
    - Capabilities section is mandatory (contract with sdd-spec)
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Every requirement must have at least one scenario
  design:
    - Document architecture decisions with rationale
    - Include concrete file paths
    - Keep under 800 words
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
    - Include Review Workload Forecast for changes above 200 lines
  apply:
    guidelines:
      - Follow existing layered architecture (API → Services → Repositories)
      - Maintain tenant isolation via academy_id on all new entities
      - Use async/await patterns consistent with existing code
    tdd: true
    test_command: "cd backend && pytest -v"
  verify:
    test_command: "cd backend && pytest -v"
    build_command: "cd frontend && tsc && cd ../backend && python -m py_compile app/main.py"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
    - ISO date format for archive folder prefix (YYYY-MM-DD)
